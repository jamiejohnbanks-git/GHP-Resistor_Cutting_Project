<text x="17" y="224" font-family="Arial,sans-serif" font-size="3" font-weight="700" fill="#ad2935">U1 POWER AND CONTROL - DO NOT APPLY 5V TO PIN 20</text>
<text x="17" y="231" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">Pin 20 (VCC) -&gt; regulated 3.3V; pin 1 (DIR) -&gt; 3.3V.</text>
<text x="17" y="237" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">Pins 10 (GND) and 19 (/OE) -&gt; common GND.</text>
<text x="17" y="243" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">C1: 100nF directly between pins 20 and 10.</text>
<text x="17" y="249" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">Unused inputs 8, 9 -&gt; GND; outputs 11, 12 unconnected.</text>
<text x="17" y="255" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">R1/R2 above hold both CS inputs HIGH during Nano reset.</text>
<text x="17" y="261" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">Logical symbol, NOT physical package view: locate pin 1 by notch/dot.</text>
<text x="218" y="224" font-family="Arial,sans-serif" font-size="3" font-weight="700" fill="#173145">U2 POWER / UNUSED CHANNELS AND TFT POWER</text>
<text x="218" y="231" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">Pin 14 -&gt; Nano 5V; pins 7 (GND), 1 (/OE) -&gt; GND.</text>
<text x="218" y="237" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">C2: 100nF directly between pins 14 and 7.</text>
<text x="218" y="243" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">Unused /OE 4,10,13 -&gt; 5V; inputs 5,9,12 -&gt; GND;</text>
<text x="218" y="249" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">unused outputs 6,8,11 unconnected. Do not substitute HC125.</text>
<text x="218" y="255" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">TFT GND -&gt; common GND. VCC: regulated 5V, verify U1/J1 on TFT.</text>
<text x="218" y="261" font-family="Arial,sans-serif" font-size="2.7" font-weight="400" fill="#173145">LED: leave open until current limiting/supply confirmed.</text>
<text x="12" y="277" font-family="Arial,sans-serif" font-size="2.85" font-weight="400" fill="#173145">Leave TFT SDO/MISO, T_IRQ and SD-card pins open. Encoder/I2C devices unplugged. Power together; verify reset sequencing.</text>
<text x="12" y="283" font-family="Arial,sans-serif" font-size="2.65" font-weight="400" fill="#173145">3.3V source: complete AP63203QWU-7 circuit or regulated module. Keep D5/D6, A0-A3 and D7-D12 on their existing motor functions.</text>
<text x="12" y="291" font-family="Arial,sans-serif" font-size="2.65" font-weight="700" fill="#ad2935">RRC-TFT-002 Rev A | 26 Nov 2026 | New software-SPI map: replaces earlier hardware-SPI proposal | Confirm actual IC package markings.</text>
